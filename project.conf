# Unique project name
name: sysexts

# Required BuildStream version
min-version: 2.8

# Subdirectory where elements are stored
element-path: elements

(@):
  - freedesktop-sdk.bst:include/runtime.yml
  - include/install-dirs.yml
  - include/aliases.yml

options:
  arch:
    type: arch
    description: Machine Architecture
    variable: arch
    values:
      - x86_64
      - aarch64

fatal-warnings:
- overlaps
- unaliased-url
- unstaged-files

sandbox:
  build-arch: "%{arch}"

variables:
  (@):
  - freedesktop-sdk.bst:include/repo_branches.yml
  (?):
    - arch == "x86_64":
        go-arch: "amd64"
        systemd-arch: "x86-64"
    - arch == "aarch64":
        go-arch: "arm64"
        systemd-arch: "arm64"
    - arch == "ppc64le":
        gcc_arch: "powerpc64le"
        go-arch: "ppc64le"
        systemd-arch: "ppc64-le"
    - arch == "riscv64":
        go-arch: "riscv64"
        systemd-arch: "riscv64"

plugins:
  - origin: junction
    junction: plugins/buildstream-plugins.bst
    elements:
      - autotools
      - meson
      - cmake
      - make
    sources:
      - patch
      - docker

  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    elements:
      - cargo
      - collect_manifest
      - flatpak_image
      - flatpak_repo
      - ostree
      - pyproject
    sources:
      - anitya
      - gen_cargo_lock
      - cargo2
      - git_module
      - git_repo
      - patch_queue
      - zip

sources:
  git_repo:
    config:
      ref-format: git-describe
  cargo2:
    config:
      url: crates:crates
      git-mirrors:
        https://github.com/: "github:"
        https://gitlab.com/: "gitlab:"
        https://codeberg.org/: "codeberg:"

junctions:
  internal:
  - plugins/buildstream-plugins.bst
  - plugins/buildstream-plugins-community.bst
